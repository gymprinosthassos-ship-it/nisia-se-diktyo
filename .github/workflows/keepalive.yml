name: Supabase Free Tier Keep-Alive

on:
  schedule:
    # Εκτελείται κάθε 4 ημέρες στις 08:00 UTC (για να αποτρέψει την παύση των 7 ημερών)
    - cron: '0 8 */4 * *'
  workflow_dispatch: # Δυνατότητα χειροκίνητης εκτέλεσης

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Public REST Endpoint
        run: |
          echo "Pinging Supabase database to prevent inactivity pausing..."
          curl -s -f "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/entries?select=id&limit=1" \
               -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" || true
          echo "Keep-alive ping sent successfully."
